name: Windows build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Set application version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = "1.0.${{ github.run_number }}"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build, publish and validate
        shell: pwsh
        run: .\scripts\build.ps1 -AppVersion "$env:APP_VERSION"

      - name: Generate installer SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "artifacts/installer/Telegram-Setup.exe"
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Telegram-Setup.exe" | Set-Content -Path "$installer.sha256" -Encoding ascii

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Desktop-win-x64
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Desktop-Installer
          path: |
            artifacts/installer/Telegram-Setup.exe
            artifacts/installer/Telegram-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: Telegram Desktop v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/installer/Telegram-Setup.exe
            artifacts/installer/Telegram-Setup.exe.sha256
          generate_release_notes: true
          make_latest: true
